<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>診断結果 | サイコソフィア診断 | AI-KNOW</title>
<meta id="metaDesc" name="description" content="サイコソフィア診断の結果ページ">
<meta id="ogTitle" property="og:title" content="サイコソフィア診断 結果 | AI-KNOW">
<meta id="ogDesc" property="og:description" content="">
<meta name="twitter:card" content="summary_large_image">
<meta id="ogImage" property="og:image" content="https://tanitanistudio.github.io/psychosofia-diagnosis/img/VELF.png">
<meta id="twitterImage" name="twitter:image" content="https://tanitanistudio.github.io/psychosofia-diagnosis/img/VELF.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #07101C;
  --bg-primary: #0D1120;
  --bg-secondary: #131826;
  --bg-card: #10182A;
  --border: #252D44;
  --border-subtle: #1C2234;
  --text-primary: #F3EFE6;
  --text-secondary: #B0B5CC;
  --text-muted: #8891AE;
  --brand: #C9A84C;
  --brand-light: #D9BC70;
  --axis-V: #D6A84A; --axis-V-muted: rgba(214,168,74,.18);
  --axis-E: #D84F8B; --axis-E-muted: rgba(216,79,139,.18);
  --axis-L: #3B8CFF; --axis-L-muted: rgba(59,140,255,.18);
  --axis-F: #78B95A; --axis-F-muted: rgba(120,185,90,.18);
  --type-color: var(--brand);
  --type-muted: rgba(201,168,76,.18);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100svh;
  -webkit-font-smoothing: antialiased;
}

/* ── Nav ──────────────────── */
.nav {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.25rem; height: 56px;
  background: rgba(8,11,20,.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-subtle);
}
.nav-logo { font-family:'Inter',sans-serif; font-weight:700; font-size:.82rem; letter-spacing:.1em; color:var(--brand); text-decoration:none; }
.nav-logo span { color:var(--text-secondary); }
.btn-retake {
  background: none; border: 1px solid var(--border);
  color: var(--text-secondary); font-size:.78rem; padding:.4rem .9rem;
  border-radius:8px; cursor:pointer; transition:border-color .2s,color .2s;
  text-decoration:none; display:inline-flex; align-items:center; gap:.3rem;
}
.btn-retake:hover { border-color:var(--text-secondary); color:var(--text-primary); }
.btn-retake:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }

/* ── Page layout ──────────── */
.page { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 5rem; }

/* ── Not found ────────────── */
.not-found { text-align:center; padding:6rem 1.25rem; }
.not-found h1 { font-family:'Noto Serif JP',serif; font-size:1.5rem; margin-bottom:1rem; }
.not-found p { color:var(--text-secondary); margin-bottom:2rem; }

/* ── Hero card ────────────── */
.result-hero {
  --bg-deep: #071124;
  --card-bg: #101832;
  --card-bg-2: #0b142b;
  --blue: #398cff;
  --blue-soft: rgba(56, 140, 255, 0.45);
  --gold: #d8a84b;
  --text-main: #f4efe4;
  --text-sub: #c8d1e6;
  --text-muted-hero: #8f9ab8;

  position: relative;
  width: 100%;
  margin-bottom: 1.5rem;
  padding: clamp(28px, 5vw, 52px) clamp(22px, 5vw, 56px) 48px;
  border-radius: 34px;

  background:
    radial-gradient(circle at 50% 18%, rgba(32, 112, 255, 0.24), transparent 32%),
    radial-gradient(circle at 50% 0%, rgba(54, 129, 255, 0.12), transparent 42%),
    linear-gradient(180deg, var(--card-bg) 0%, var(--card-bg-2) 100%);

  border: 1px solid rgba(91, 153, 255, 0.38);

  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.035) inset,
    0 0 36px rgba(51, 127, 255, 0.18),
    0 28px 80px rgba(0, 0, 0, 0.46);

  color: var(--text-main);
  text-align: center;
  overflow: hidden;
  animation: fadeUp .5s ease both;
}

/* インナーグロー */
.result-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    0 0 0 1px rgba(72, 145, 255, 0.42) inset,
    0 0 32px rgba(72, 145, 255, 0.22) inset;
  z-index: 0;
}

/* 下部暗化グラデーション */
.result-hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 38%;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(6, 11, 28, 0.26) 58%,
    rgba(4, 8, 20, 0.38) 100%
  );
  z-index: 0;
}

.result-hero > * {
  position: relative;
  z-index: 1;
}

.result-hero-body {
  margin-top: 0;
}

@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* LVEF バッジ */
.type-code-big {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 190px;
  padding: 13px 34px;
  margin: 0 auto 24px;

  border-radius: 18px;
  border: 1px solid rgba(68, 145, 255, 0.78);

  background:
    radial-gradient(circle at 50% 0%, rgba(75, 153, 255, 0.42), transparent 60%),
    linear-gradient(180deg, rgba(34, 81, 160, 0.72), rgba(18, 42, 94, 0.84));

  color: #4b94ff;
  font-size: clamp(30px, 6vw, 46px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.22em;
  text-indent: 0.22em;

  box-shadow:
    0 0 28px rgba(48, 129, 255, 0.38),
    0 0 0 1px rgba(255, 255, 255, 0.04) inset;
}

/* バッジ左右の装飾線 */
.type-code-big::before,
.type-code-big::after {
  content: "";
  position: absolute;
  top: 50%;
  width: clamp(72px, 18vw, 160px);
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(216, 168, 75, 0.68),
    transparent
  );
  transform: translateY(-50%);
}

.type-code-big::before {
  right: calc(100% + 22px);
}

.type-code-big::after {
  left: calc(100% + 22px);
}

/* タイプ名 */
.type-name-big {
  margin: 0 0 12px;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size: clamp(48px, 9vw, 76px);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: 0.14em;
  text-indent: 0.14em;

  color: #f5efdf;

  text-shadow:
    0 2px 0 rgba(0, 0, 0, 0.35),
    0 0 18px rgba(255, 255, 255, 0.08);
}

/* キャッチコピー */
.type-catchcopy {
  position: relative;

  margin: 0 auto 18px;
  padding-bottom: 22px;

  color: var(--gold);
  font-size: clamp(15px, 2.8vw, 20px);
  line-height: 1.8;
  letter-spacing: 0.16em;
}

.type-catchcopy::after {
  content: "◇";
  position: absolute;
  left: 50%;
  bottom: -8px;
  transform: translateX(-50%);

  color: var(--gold);
  font-size: 14px;
  text-shadow: 0 0 12px rgba(216, 168, 75, 0.45);
}

/* ── Function order ────────── */
.func-order {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px;

  margin: 0 auto 22px;
}

.func-rank {
  display: flex; flex-direction: column; align-items: center; gap: .2rem;
}
.func-rank-num {
  font-family: 'Inter', sans-serif; font-size: .65rem;
  color: var(--text-muted); font-weight: 600;
}

.func-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  min-width: 86px;
  padding: 10px 18px;
  border-radius: 999px;

  font-size: 17px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.04em;

  color: #dbe8ff;
  background: rgba(22, 38, 82, 0.74);
  border: 1px solid rgba(100, 155, 255, 0.42);

  box-shadow:
    0 0 18px rgba(54, 131, 255, 0.16),
    0 0 0 1px rgba(255, 255, 255, 0.035) inset;
}

.func-badge.V { color:#f1bd54; border-color:rgba(228,170,68,.78); background:rgba(116,77,22,.45); }
.func-badge.E { color:#ff6ea8; border-color:rgba(255,83,149,.78); background:rgba(117,28,76,.44); }
.func-badge.L { color:#55a0ff; border-color:rgba(67,145,255,.78); background:rgba(22,74,145,.46); }
.func-badge.F { color:#81d957; border-color:rgba(121,208,80,.78); background:rgba(47,103,35,.44); }

.func-arrow { color:var(--text-muted); font-size:.9rem; padding-bottom:1.1rem; }

/* 説明文 */
.type-desc {
  width: min(100%, 560px);
  margin: 0 auto;

  color: rgba(240, 244, 255, 0.86);
  font-size: clamp(15px, 2.6vw, 18px);
  line-height: 1.85;
  letter-spacing: 0.04em;
  text-align: left;

  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.32);
}

/* ── Hero animations ────────── */
.result-hero:hover .type-chara-img::before {
  animation: heroAuraPulse 2.4s ease-in-out infinite;
}
.result-hero:hover .type-chara-img img {
  animation: heroFloat 3.8s ease-in-out infinite;
}
@keyframes heroAuraPulse {
  0%   { opacity: 0.78; transform: translateX(-50%) scale(0.96); }
  50%  { opacity: 1;    transform: translateX(-50%) scale(1.08); }
  100% { opacity: 0.78; transform: translateX(-50%) scale(0.96); }
}
@keyframes heroFloat {
  0%   { transform: scale(1.03) translateY(0); }
  50%  { transform: scale(1.045) translateY(-4px); }
  100% { transform: scale(1.03) translateY(0); }
}

/* ── Hero mobile ────────────── */
@media (max-width: 520px) {
  .result-hero {
    padding: 28px 18px 36px;
    border-radius: 26px;
  }
  .type-chara-img {
    width: calc(100% - 2rem);
    height: clamp(200px, 34vh, 260px);
    margin-top: -4px;
    margin-bottom: -16px;
  }
  .type-code-big {
    min-width: 148px;
    padding: 11px 26px;
    margin-bottom: 20px;
  }
  .type-code-big::before { right: calc(100% + 12px); }
  .type-code-big::after  { left:  calc(100% + 12px); }
  .type-code-big::before,
  .type-code-big::after  { width: 48px; }
  .func-order { gap: 10px; }
  .func-badge { min-width: 72px; padding: 9px 13px; font-size: 15px; }
  .type-desc  { line-height: 1.75; }
}

/* ── Border type notice ────── */
.border-notice {
  display: none;
  background: rgba(201,168,76,.08);
  border: 1px solid rgba(201,168,76,.25);
  border-radius: 12px;
  padding: .85rem 1.1rem;
  margin-bottom: 1.25rem;
  font-size: .85rem;
  color: var(--brand);
  animation: fadeUp .5s .1s ease both;
}
.border-notice.visible { display: block; }
.border-notice strong { display:block; margin-bottom:.25rem; }

/* ── Score bars ────────────── */
.score-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  animation: fadeUp .5s .15s ease both;
}
.score-section h2 {
  font-size: .82rem; font-weight: 700; letter-spacing: .08em;
  color: var(--text-muted); text-transform: uppercase; font-family:'Inter',sans-serif;
  margin-bottom: 1rem;
}
.score-row { display:flex; align-items:center; gap:.75rem; margin-bottom:.75rem; }
.score-row:last-child { margin-bottom:0; }
.score-axis-label {
  font-family:'Inter',sans-serif; font-weight:700; font-size:.78rem;
  width:20px; flex-shrink:0;
}
.score-name { font-size:.78rem; color:var(--text-secondary); width:52px; flex-shrink:0; }
.score-track {
  flex:1; height:8px; background:var(--border); border-radius:4px; overflow:hidden;
}
.score-fill {
  height:100%; border-radius:4px; width:0;
  transition: width .9s cubic-bezier(.16,1,.3,1);
}
.score-val {
  font-family:'Inter',sans-serif; font-size:.72rem;
  color:var(--text-muted); width:32px; text-align:right; flex-shrink:0;
}
.rank-badge {
  font-family:'Inter',sans-serif; font-size:.7rem; font-weight:700;
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-secondary); color:var(--text-muted); flex-shrink:0;
}
.rank-badge.first { background:var(--brand); color:#000; }

/* ── Strengths/Challenges ──── */
.str-chg {
  display: grid; gap: 1rem;
  margin-bottom: 1.25rem;
  animation: fadeUp .5s .2s ease both;
}
.str-card, .chg-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
}
.str-card { border-top: 2px solid var(--axis-F); }
.chg-card { border-top: 2px solid var(--axis-E); }
.str-chg-title {
  font-size: .78rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; font-family:'Inter',sans-serif;
  margin-bottom: 1rem;
}
.str-card .str-chg-title { color:var(--axis-F); }
.chg-card .str-chg-title { color:var(--axis-E); }
.str-chg-list { list-style:none; display:flex; flex-direction:column; gap:.6rem; }
.str-chg-list li {
  display:flex; align-items:flex-start; gap:.5rem;
  font-size:.9rem; color:var(--text-secondary); line-height:1.6;
}
.str-chg-list li::before {
  flex-shrink:0; margin-top:.15rem; font-size:.75rem;
}
.str-card li::before { content:'✓'; color:var(--axis-F); }
.chg-card li::before { content:'△'; color:var(--axis-E); }

/* ── Share ─────────────────── */
.share-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  animation: fadeUp .5s .25s ease both;
}
.share-section h2 {
  font-size: .82rem; font-weight:700; letter-spacing:.08em;
  color:var(--text-muted); text-transform:uppercase; font-family:'Inter',sans-serif;
  margin-bottom: 1rem;
}
.share-btns { display:flex; gap:.75rem; flex-wrap:wrap; }
.share-btn {
  display:inline-flex; align-items:center; gap:.5rem;
  padding:.55rem 1.1rem; border-radius:10px;
  font-size:.85rem; font-weight:700; cursor:pointer;
  transition:opacity .2s, transform .15s; border:none;
  text-decoration:none;
}
.share-btn:hover { opacity:.85; transform:translateY(-1px); }
.share-btn:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
.share-btn-x   { background:#000; border:1px solid #333; color:#fff; }
.share-btn-line { background:#06C755; color:#fff; }
.share-btn-copy { background:var(--bg-secondary); border:1px solid var(--border); color:var(--text-secondary); }
.copy-feedback {
  font-size:.78rem; color:var(--axis-F);
  margin-top:.6rem; display:none;
}
.copy-feedback.visible { display:block; }

/* ── CTA ───────────────────── */
.cta-wrap {
  display:flex; flex-direction:column; gap:.75rem;
  animation: fadeUp .5s .3s ease both;
}
.btn-primary-full {
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  background:var(--brand); color:#000;
  font-weight:700; font-size:1rem;
  padding:.9rem 2rem; border-radius:12px;
  text-decoration:none; border:none; cursor:pointer;
  transition:background .2s, transform .2s, box-shadow .2s;
  width:100%;
}
.btn-primary-full:hover {
  background:var(--brand-light);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(201,168,76,.25);
}
.btn-primary-full:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
.btn-secondary-full {
  display:flex; align-items:center; justify-content:center; gap:.5rem;
  background:none; border:1px solid var(--border);
  color:var(--text-secondary); font-size:.9rem;
  padding:.75rem 2rem; border-radius:12px;
  text-decoration:none; cursor:pointer; width:100%;
  transition:border-color .2s, color .2s;
}
.btn-secondary-full:hover { border-color:var(--text-secondary); color:var(--text-primary); }
.btn-secondary-full:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }

/* ── Responsive ────────────── */
@media (min-width:640px) {
  .str-chg { grid-template-columns:1fr 1fr; }
  .page { padding:2.5rem 2rem 6rem; }
  .nav { padding:0 2rem; }
}
@media (min-width:720px) {
  .result-hero { padding:2rem 2.5rem; }
}

/* ── Scene / Tips ─────────── */
.scene-section, .tip-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
}
.scene-section { border-top: 2px solid var(--type-color); animation: fadeUp .5s .17s ease both; }
.tip-section   { border-top: 2px solid var(--brand);      animation: fadeUp .5s .23s ease both; }
.scene-tip-title {
  font-size: .82rem; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; font-family: 'Inter', sans-serif;
  margin-bottom: 1rem;
}
.scene-section .scene-tip-title { color: var(--type-color); }
.tip-section   .scene-tip-title { color: var(--brand); }
.scene-tip-list { list-style: none; display: flex; flex-direction: column; gap: .7rem; }
.scene-tip-list li {
  display: flex; align-items: flex-start; gap: .6rem;
  font-size: .9rem; color: var(--text-secondary); line-height: 1.7;
}
.scene-tip-list li::before { flex-shrink: 0; margin-top: .15rem; font-size: .78rem; }
.scene-section li::before { content: '✦'; color: var(--type-color); }
.tip-section   li::before { content: '→'; color: var(--brand); }

/* ── Character image ───────── */
.type-chara-img {
  position: relative;
  width: min(100%, 400px);
  height: clamp(230px, 36vh, 340px);
  margin: -10px auto -20px;
  display: grid;
  place-items: center;
  overflow: visible;
}

/* 背後の発光オーラ */
.type-chara-img::before {
  content: "";
  position: absolute;
  width: 82%;
  height: 58%;
  top: 16%;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(38, 137, 255, 0.56) 0%, rgba(29, 100, 255, 0.22) 40%, transparent 70%);
  filter: blur(22px);
  opacity: 0.95;
  z-index: 0;
}

.type-chara-img img {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: scale(1.03);
  transform-origin: center center;
  filter:
    drop-shadow(0 24px 46px rgba(0, 0, 0, 0.48))
    drop-shadow(0 0 24px rgba(48, 126, 255, 0.22));
  -webkit-mask-image:
    linear-gradient(to bottom, transparent 0%, #000 8%, #000 84%, transparent 100%),
    linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    linear-gradient(to bottom, transparent 0%, #000 8%, #000 84%, transparent 100%),
    linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
  mask-composite: intersect;
}

/* ── Axis Explanation ─────── */
.axis-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  animation: fadeUp .5s .12s ease both;
}
.axis-section-title {
  font-size: .82rem; font-weight: 700; letter-spacing: .08em;
  color: var(--text-muted); text-transform: uppercase; font-family:'Inter',sans-serif;
  margin-bottom: 1.25rem;
}
.axis-row {
  display: flex; gap: 1.5rem; align-items: flex-start;
  margin-bottom: 1.25rem; padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border-subtle);
}
.axis-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.axis-row-left {
  display: flex; flex-direction: column; align-items: center; gap: .5rem;
  flex-shrink: 0; width: 60px;
}
.axis-rank-num {
  font-family: 'Inter', sans-serif; font-size: .62rem; font-weight: 700;
  color: var(--text-muted);
}
.axis-role-name {
  font-size: .62rem; color: var(--text-muted); text-align: center; line-height: 1.3;
}
.axis-row-body { flex: 1; }
.axis-func-title { font-size: .9rem; font-weight: 700; margin-bottom: .5rem; }
.axis-func-desc {
  font-size: .82rem; color: var(--text-secondary); line-height: 1.65; margin-bottom: 0;
}

const AXIS_LABELS = { V:"意志", E:"感情", L:"論理", F:"身体" };
const AXIS_COLORS = { V:"var(--axis-V)", E:"var(--axis-E)", L:"var(--axis-L)", F:"var(--axis-F)" };
const AXIS_MUTED  = { V:"var(--axis-V-muted)", E:"var(--axis-E-muted)", L:"var(--axis-L-muted)", F:"var(--axis-F-muted)" };
const RESULT_KEY  = 'aiknow_psychosofia_result';

const AXIS_DETAILS = {
  V: { label:"意志 (V)", meaning:"目標設定・意志力・自己推進力を司る機能。「何を望み、どう動くか」を決める軸。強いV機能は揺るぎない意志と行動の方向性をもたらす。" },
  E: { label:"感情 (E)", meaning:"感情的知性・共感・表現力を司る機能。「自分や他者の感情をどう感じ、表現するか」を決める軸。強いE機能は豊かな感情表現と深い人間的つながりをもたらす。" },
  L: { label:"論理 (L)", meaning:"論理的思考・分析・概念化を司る機能。「物事をどう体系的に理解し整理するか」を決める軸。強いL機能は鋭い分析力と構造的な問題解決力をもたらす。" },
  F: { label:"身体 (F)", meaning:"身体感覚・実践的知性・感覚的認識を司る機能。「身体を通じた直感・行動・体験」を決める軸。強いF機能は鋭い身体感覚と現実的な実践力をもたらす。" }
};
const POSITION_ROLES = [
  { name:"主機能",   note:"最も発達した核となる機能。意識しなくても自然に発揮でき、あなたのアイデンティティの中心を形成する。" },
  { name:"補助機能", note:"主機能をサポートし、強みに深みを与える機能。比較的自然に使え、主機能の弱点を補完する。" },
  { name:"第3機能",  note:"意識的に使えるが、エネルギーを消費しやすい領域。意識的な努力で伸ばせる成長ポイント。" },
  { name:"劣等機能", note:"最も未発達な機能。苦手意識を感じやすいが、ここに成長の最大の可能性が秘められている。" }
];

// ─── Bootstrap ──────────────────────────────────────────────────────────────
function init() {
  const params  = new URLSearchParams(location.search);
  const urlType = params.get('type')?.toUpperCase();

  let typeCode  = null;
  let scores    = null;
  let isBorder  = false;

  if (urlType && TYPES[urlType]) {
    typeCode = urlType;
    // try to load scores from storage
    try {
      const saved = JSON.parse(localStorage.getItem(RESULT_KEY) || 'null');
      if (saved?.typeCode === typeCode) { scores = saved.scores; isBorder = saved.isBorder; }
    } catch(e) {}
  } else {
    // Try storage
    try {
      const saved = JSON.parse(localStorage.getItem(RESULT_KEY) || 'null');
      if (saved?.typeCode && TYPES[saved.typeCode]) {
        typeCode = saved.typeCode; scores = saved.scores; isBorder = saved.isBorder;
      }
    } catch(e) {}
  }

  if (!typeCode) { renderNotFound(); return; }
  renderResult(typeCode, scores, isBorder);
}

// ─── Render ──────────────────────────────────────────────────────────────────
function renderResult(code, scores, isBorder) {
  const t = TYPES[code];
  const dominant = t.dominant;
  const order = code.split('');

  // CSS variables for this type's axis color
  document.documentElement.style.setProperty('--type-color', `var(--axis-${dominant})`);
  document.documentElement.style.setProperty('--type-muted', AXIS_MUTED[dominant]);

  // OGP meta update
  const shareText = `私はサイコソフィア診断で「${t.name}（${code}）」でした！${t.catchcopy}`;
  document.getElementById('metaDesc').content = shareText;
  document.getElementById('ogTitle').content  = `${t.name}（${code}）| サイコソフィア診断 | AI-KNOW`;
  document.getElementById('ogDesc').content   = shareText;
  document.title = `${t.name}（${code}）| サイコソフィア診断`;
  const ogImageUrl = `https://tanitanistudio.github.io/psychosofia-diagnosis/img/${code}.png`;
  document.getElementById('ogImage')?.setAttribute('content', ogImageUrl);
  document.getElementById('twitterImage')?.setAttribute('content', ogImageUrl);

  const page = document.getElementById('pageContent');
  page.innerHTML = buildHTML(code, t, order, scores, isBorder);

  // Animate score bars after paint
  if (scores) {
    const maxScore = Math.max(...Object.values(scores));
    requestAnimationFrame(() => setTimeout(() => {
      order.forEach((axis, i) => {
        const bar = document.getElementById('scoreBar_' + axis);
        if (bar) bar.style.width = ((scores[axis] / maxScore) * 100) + '%';
      });
    }, 100));
  }

  // Wire up share & copy
  wireShare(code, t, shareText);
}

function buildAxisExplanation(order) {
  const rows = order.map((ax, i) => {
    const detail = AXIS_DETAILS[ax];
    const role   = POSITION_ROLES[i];
    return `
      <div class="axis-row">
        <div class="axis-row-left">
          <span class="axis-rank-num">${i+1}位</span>
          <span class="func-badge ${ax}">${ax}</span>
          <span class="axis-role-name">${role.name}</span>
        </div>
        <div class="axis-row-body">
          <div class="axis-func-title" style="color:${AXIS_COLORS[ax]}">${detail.label}</div>
          <p class="axis-func-desc">${detail.meaning}</p>
          <p class="axis-position-note">${role.note}</p>
        </div>
      </div>`;
  }).join('');
  return `
    <section class="axis-section" aria-label="機能軸の解説">
      <h2 class="axis-section-title">機能軸の解説</h2>
      ${rows}
    </section>`;
}

function buildHTML(code, t, order, scores, isBorder) {
  const dominant = t.dominant;

  // Function order chips
  const funcOrder = order.map((ax, i) => `
    <div class="func-rank">
      <span class="func-rank-num">${i+1}位</span>
      <span class="func-badge ${ax}">${AXIS_LABELS[ax]}</span>
    </div>
    ${i < 3 ? '<span class="func-arrow" aria-hidden="true">›</span>' : ''}
  `).join('');

  // Score section (only if scores available)
  const scoreHTML = scores ? (() => {
    const sorted = [...order].sort((a,b) => scores[b]-scores[a]);
    const maxScore = Math.max(...Object.values(scores));
    const rows = order.map(axis => {
      const rank = sorted.indexOf(axis) + 1;
      const pct  = Math.round((scores[axis] / maxScore) * 100);
      return `
        <div class="score-row">
          <span class="score-axis-label" style="color:${AXIS_COLORS[axis]}">${axis}</span>
          <span class="score-name">${AXIS_LABELS[axis]}</span>
          <div class="score-track"><div class="score-fill" id="scoreBar_${axis}" style="background:${AXIS_COLORS[axis]}"></div></div>
          <span class="score-val">${Math.round(scores[axis])}</span>
          <span class="rank-badge${rank===1?' first':''}">${rank}</span>
        </div>`;
    }).join('');
    return `
      <section class="score-section" aria-label="スコア詳細">
        <h2>4軸スコア</h2>${rows}
      </section>`;
  })() : '';

  // Border notice
  const borderHTML = isBorder ? `
    <div class="border-notice visible" role="alert">
      <strong>⚠ 境界タイプの可能性があります</strong>
      上位2軸のスコア差が小さいため、隣接タイプの側面も持っている可能性があります。
    </div>` : '';

  // Strengths / Challenges / Scene / Tips
  const strItems   = t.str.map(s => `<li>${s}</li>`).join('');
  const chgItems   = t.chg.map(c => `<li>${c}</li>`).join('');
  const sceneItems = t.scene.map(s => `<li>${s}</li>`).join('');
  const tipItems   = t.tip.map(t => `<li>${t}</li>`).join('');

  const axisExplanationHTML = buildAxisExplanation(order);

  return `
    <section class="result-hero" aria-labelledby="typeName">
      <div class="type-chara-img">
        <img src="img/${code}.png" alt="${t.name}のキャラクター" onerror="this.style.display='none'">
      </div>
      <div class="result-hero-body">
        <div class="type-code-big" aria-label="タイプコード ${code}">${code}</div>
        <h1 class="type-name-big" id="typeName">${t.name}</h1>
        <p class="type-catchcopy">${t.catchcopy}</p>
        <div class="func-order" aria-label="機能優先順位">${funcOrder}</div>
        <p class="type-desc">${t.desc}</p>
      </div>
    </section>

    ${borderHTML}

    <section class="scene-section" aria-label="こんな場面で輝く">
      <h2 class="scene-tip-title">こんな場面で輝く</h2>
      <ul class="scene-tip-list">${sceneItems}</ul>
    </section>

    <div class="str-chg" role="region" aria-label="強みと成長のポイント">
      <div class="str-card">
        <h2 class="str-chg-title">強み</h2>
        <ul class="str-chg-list" aria-label="強み一覧">${strItems}</ul>
      </div>
      <div class="chg-card">
        <h2 class="str-chg-title">成長のポイント</h2>
        <ul class="str-chg-list" aria-label="成長のポイント一覧">${chgItems}</ul>
      </div>
    </div>

    <section class="tip-section" aria-label="あなたへのヒント">
      <h2 class="scene-tip-title">あなたへのヒント</h2>
      <ul class="scene-tip-list">${tipItems}</ul>
    </section>

    ${axisExplanationHTML}
    ${scoreHTML}

    <section class="share-section" aria-label="結果をシェア">
      <h2>結果をシェア</h2>
      <div class="share-btns">
        <button class="share-btn share-btn-x" id="shareX" aria-label="Xでシェア">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          Xでシェア
        </button>
        <button class="share-btn share-btn-line" id="shareLINE" aria-label="LINEでシェア">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.04 2 11.05c0 3.46 2.03 6.49 5.05 8.22.18.1.28.3.28.5l-.06 1.84c-.02.45.48.73.87.5l2.05-1.2c.14-.08.3-.1.46-.06.76.2 1.55.3 2.35.3 5.52 0 10-4.04 10-9.05S17.52 2 12 2z"/></svg>
          LINEでシェア
        </button>
        <button class="share-btn share-btn-copy" id="shareCopy" aria-label="リンクをコピー">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          リンクをコピー
        </button>
      </div>
      <p class="copy-feedback" id="copyFeedback" role="status" aria-live="polite">✓ コピーしました</p>
    </section>

    <div class="cta-wrap">
      <a href="quiz.html" class="btn-primary-full">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 4v5h5M16 16v-5h-5M4.1 9A8 8 0 0116 6M19.9 11A8 8 0 014 14"/></svg>
        もう一度診断する
      </a>
      <a href="lp.html" class="btn-secondary-full">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 2l8 8-8 8M2 10h16"/></svg>
        診断ページへ戻る
      </a>
    </div>`;
}

function renderNotFound() {
  document.getElementById('pageContent').innerHTML = `
    <div class="not-found" role="main">
      <h1>診断結果が見つかりません</h1>
      <p>まず診断を完了してください。</p>
      <a href="quiz.html" class="btn-primary-full" style="max-width:280px;margin:0 auto;">診断を始める</a>
    </div>`;
}

// ─── Share ───────────────────────────────────────────────────────────────────
function wireShare(code, t, shareText) {
  const url      = window.location.origin + window.location.pathname + `?type=${code}`;
  const tweetTxt = `${shareText} #サイコソフィア診断 #AIKNOW`;
  const lineTxt  = `${shareText}\n${url}`;

  document.getElementById('shareX')?.addEventListener('click', async () => {
    // モバイル: Web Share API で画像ファイルごと共有
    if (navigator.share) {
      try {
        const response = await fetch(`img/${code}.png`);
        const blob = await response.blob();
        const file = new File([blob], `${code}_psychosofia.png`, { type: 'image/png' });
        if (navigator.canShare?.({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `${t.name}（${code}）| サイコソフィア診断`,
            text: tweetTxt,
          });
          return;
        }
      } catch(e) { /* フォールバックへ */ }
    }
    // デスクトップ: tweet インテント
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetTxt)}&url=${encodeURIComponent(url)}`, '_blank', 'noopener');
  });
  document.getElementById('shareLINE')?.addEventListener('click', () => {
    window.open(`https://line.me/R/msg/text/?${encodeURIComponent(lineTxt)}`, '_blank', 'noopener');
  });
  document.getElementById('shareCopy')?.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(url);
    } catch(e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    const fb = document.getElementById('copyFeedback');
    fb.classList.add('visible');
    setTimeout(() => fb.classList.remove('visible'), 2500);
  });
}

init();
</script>
